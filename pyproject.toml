[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-colab-mcp"
version = "1.0.0"
description = "Standalone, framework-agnostic MCP server for controlling Google Colab (and any Jupyter-compatible runtime) from any MCP-compatible AI agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "jupyter-client>=8.6.0",
    "nbformat>=5.10.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
google-colab-mcp = "google_colab_mcp.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
